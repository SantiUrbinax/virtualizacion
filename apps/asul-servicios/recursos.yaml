apiVersion: v1
kind: ConfigMap
metadata:
  name: noticias-html
  namespace: parcial-asul
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Noticias ASUL</title>
    </head>
    <body>
      <h1>Noticias ASUL</h1>
      <p>Servicio administrado dentro del cluster de Kubernetes con acceso por medio de Traefik.</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noticias
  namespace: parcial-asul
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noticias
  template:
    metadata:
      labels:
        app: noticias
    spec:
      containers:
        - name: noticias
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: noticias-html
---
apiVersion: v1
kind: Service
metadata:
  name: noticias-service
  namespace: parcial-asul
spec:
  selector:
    app: noticias
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: soporte-html
  namespace: parcial-asul
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Soporte ASUL</title>
    </head>
    <body>
      <h1>Soporte ASUL</h1>
      <p>Aplicacion desplegada en Kubernetes y expuesta mediante el controlador Traefik.</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soporte
  namespace: parcial-asul
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soporte
  template:
    metadata:
      labels:
        app: soporte
    spec:
      containers:
        - name: soporte
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: soporte-html
---
apiVersion: v1
kind: Service
metadata:
  name: soporte-service
  namespace: parcial-asul
spec:
  selector:
    app: soporte
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: noticias-ingress
  namespace: parcial-asul
spec:
  ingressClassName: traefik
  rules:
    - host: noticias.asul.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: noticias-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: soporte-ingress
  namespace: parcial-asul
spec:
  ingressClassName: traefik
  rules:
    - host: soporte.asul.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: soporte-service
                port:
                  number: 80
