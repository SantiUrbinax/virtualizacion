apiVersion: v1
kind: Namespace
metadata:
  name: parcial-asul

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-html
  namespace: parcial-asul
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Portal ASUL</title>
    </head>
    <body>
      <h1>Portal ASUL</h1>
      <p>Este servicio utiliza Kubernetes para el despliegue y Traefik para el enrutamiento.</p>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: parcial-asul
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      containers:
        - name: portal
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: portal-html

---
apiVersion: v1
kind: Service
metadata:
  name: portal-service
  namespace: parcial-asul
spec:
  selector:
    app: portal
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

