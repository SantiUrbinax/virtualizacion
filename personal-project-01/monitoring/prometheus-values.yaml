# Proyecto de observabilidad ASUL
# Prometheus en Kubernetes / Minikube

server:
  retention: "7d"

  persistentVolume:
    enabled: true
    size: 2Gi

  service:
    type: ClusterIP
    servicePort: 80

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true
